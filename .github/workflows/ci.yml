name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          package-manager-cache: false

      - name: 校验 bundle 结构
        run: npm run check

      - name: 检查打包内容
        run: npm pack --dry-run

      - name: 冒烟测试（按 DSH 插件形状加载）
        run: |
          node --input-type=module -e "
          import { readFileSync } from 'node:fs'
          const pkg = JSON.parse(readFileSync('package.json', 'utf8'))
          const patch = readFileSync('cordis.patch.yml', 'utf8')
          if (!patch.includes(pkg.name)) throw new Error('patch does not insert ' + pkg.name)
          if (pkg.name.startsWith('@local/')) throw new Error('still carries the local placeholder scope')
          console.log('ok', pkg.name, pkg.version)
          "
